<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送信完了 | 萩原 健治</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f7f7f5; --surface: #ffffff; --text: #1f2328; --muted: #5b636e; --accent: #1f6feb; --border: #e3e5e8; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121417; --surface: #1b1e23; --text: #e8eaed; --muted: #a2a9b3; --accent: #6aa6ff; --border: #2c3138; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.9; }
    main { max-width: 560px; margin: 0 auto; padding: 96px 16px; text-align: center; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px 24px; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 0 0 1em; color: var(--muted); }
    a { display: inline-block; margin-top: 8px; padding: 12px 28px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>送信が完了しました</h1>
      <p>お問い合わせありがとうございます。<br>内容を確認のうえ、ご連絡いたします。</p>
      <a href="/">トップへ戻る</a>
    </section>
  </main>
</body>
</html>
